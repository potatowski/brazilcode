name: release

on:
  push:
    branches: [dev, main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy pull request and release
        uses: potatowski/release-flow@v1
        with:
          staging_branch: dev
          main_branch: main
